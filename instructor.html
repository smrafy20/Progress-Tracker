<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Instructor Dashboard</h1>
    <form id="uploadForm" enctype="multipart/form-data">
        <input type="file" id="videoFile" accept="video/*" required>
        <button type="submit" class="btn">Upload Video</button>
    </form>
    <h2>Uploaded Videos</h2>
    <table border="1" id="videosTable">
        <thead>
            <tr><th>File Name</th><th>File Type</th><th>Last Updated</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
    </table>
    <script>
    async function loadVideos() {
        const res = await fetch('/api/videos', {credentials: 'include'});
        const videos = await res.json();
        const tbody = document.querySelector('#videosTable tbody');
        tbody.innerHTML = '';
        videos.forEach(v => {
            const tr = document.createElement('tr');
            // Format the date for better readability
            const lastUpdated = v.last_updated ? new Date(v.last_updated).toLocaleString() : 'N/A';
            tr.innerHTML = `<td>${v.filename}</td><td>${v.filetype}</td><td>${lastUpdated}</td><td><button class="btn reset" onclick="deleteVideo('${v.filename}')">Delete</button></td>`;
            tbody.appendChild(tr);
        });
    }

    async function deleteVideo(filename) {
        if (!confirm(`Are you sure you want to delete ${filename}?`)) {
            return;
        }
        try {
            const res = await fetch(`/api/video/${filename}`, {
                method: 'DELETE',
                credentials: 'include'
            });
            const data = await res.json();
            if (data.success) {
                alert(data.message || 'Video deleted successfully!');
                loadVideos(); // Refresh the list
            } else {
                alert('Delete failed: ' + (data.message || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error deleting video:', error);
            alert('An error occurred while trying to delete the video.');
        }
    }

    document.getElementById('uploadForm').onsubmit = async function(e) {
        e.preventDefault();
        const fileInput = document.getElementById('videoFile');
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        const res = await fetch('/api/upload', {
            method: 'POST',
            body: formData,
            credentials: 'include'
        });
        const data = await res.json();
        if (data.success) {
            alert('Upload successful!');
            loadVideos();
        } else {
            alert('Upload failed: ' + data.message);
        }
    };
    loadVideos();
    </script>
</body>
</html>
