<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul>
            <li><span class="site-title">Video & PDF Platform</span></li> <!-- Changed site title -->
            <li>
                <a href="student.html">Dashboard</a> <!-- Added link to student dashboard -->
            </li>
            <li><button onclick="logout()" class="logout-btn">Logout</button></li>
        </ul>
    </nav>

    <div class="main-container">
        <h1>Instructor Dashboard</h1>
        <form id="uploadForm" enctype="multipart/form-data">
            <label for="videoFile">Upload new video:</label>
            <input type="file" id="videoFile" accept="video/*">
            <button type="submit" class="btn">Upload Video</button>
        </form>
        <form id="uploadPdfForm" enctype="multipart/form-data"> <!-- New form for PDF uploads -->
            <label for="pdfFile">Upload new PDF:</label>
            <input type="file" id="pdfFile" accept=".pdf">
            <button type="submit" class="btn">Upload PDF</button>
        </form>
        <h2>Uploaded Videos</h2>
        <table border="1" id="videosTable">
            <thead>
                <tr><th>File Name</th><th>File Type</th><th>Last Updated</th><th>Uploaded By</th><th>Actions</th></tr>
            </thead>
            <tbody></tbody>
        </table>
        <h2>Uploaded PDFs</h2> <!-- New table for PDFs -->
        <table border="1" id="pdfsTable">
            <thead>
                <tr><th>File Name</th><th>File Type</th><th>Last Updated</th><th>Uploaded By</th><th>Actions</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
    async function logout() {
        const res = await fetch('/api/logout', {
            method: 'POST',
            credentials: 'include'
        });
        const data = await res.json();
        if (data.success) {
            window.location.href = 'login.html';
        } else {
            alert('Logout failed. Please try again.');
        }
    }

    async function loadVideos() {
        const res = await fetch('/api/videos', {credentials: 'include'});
        const videos = await res.json();
        const tbody = document.querySelector('#videosTable tbody');
        tbody.innerHTML = '';
        videos.forEach(v => {
            const tr = document.createElement('tr');
            // Format the date for better readability
            const lastUpdated = v.last_updated ? new Date(v.last_updated).toLocaleString() : 'N/A';
            const instructorName = v.instructor_name || 'Unknown'; // Display instructor name
            tr.innerHTML = `<td>${v.filename}</td><td>${v.filetype}</td><td>${lastUpdated}</td><td>${instructorName}</td><td><button class="btn reset" onclick="deleteVideo('${v.filename}')">Delete</button></td>`;
            tbody.appendChild(tr);
        });
    }

    async function loadPdfs() { // New function to load PDFs
        const res = await fetch('/api/pdfs', {credentials: 'include'});
        const pdfs = await res.json();
        const tbody = document.querySelector('#pdfsTable tbody');
        tbody.innerHTML = '';
        pdfs.forEach(p => {
            const tr = document.createElement('tr');
            const lastUpdated = p.last_updated ? new Date(p.last_updated).toLocaleString() : 'N/A';
            const instructorName = p.instructor_name || 'Unknown';
            tr.innerHTML = `<td>${p.filename}</td><td>${p.filetype}</td><td>${lastUpdated}</td><td>${instructorName}</td><td><button class="btn reset" onclick="deletePdf('${p.filename}')">Delete</button></td>`;
            tbody.appendChild(tr);
        });
    }

    async function deleteVideo(filename) {
        if (!confirm(`Are you sure you want to delete ${filename}?`)) {
            return;
        }
        try {
            const res = await fetch(`/api/video/${filename}`, {
                method: 'DELETE',
                credentials: 'include'
            });
            const data = await res.json();
            if (data.success) {
                alert(data.message || 'Video deleted successfully!');
                loadVideos(); // Refresh the list
            } else {
                alert('Delete failed: ' + (data.message || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error deleting video:', error);
            alert('An error occurred while trying to delete the video.');
        }
    }

    async function deletePdf(filename) { // New function to delete a PDF
        if (!confirm(`Are you sure you want to delete ${filename}?`)) {
            return;
        }
        try {
            const res = await fetch(`/api/pdf/${filename}`, {
                method: 'DELETE',
                credentials: 'include'
            });
            const data = await res.json();
            if (data.success) {
                alert(data.message || 'PDF deleted successfully!');
                loadPdfs(); // Refresh the PDF list
            } else {
                alert('Delete failed: ' + (data.message || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error deleting PDF:', error);
            alert('An error occurred while trying to delete the PDF.');
        }
    }

    document.getElementById('uploadForm').onsubmit = async function(e) {
        e.preventDefault();
        const fileInput = document.getElementById('videoFile');
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        const res = await fetch('/api/upload', {
            method: 'POST',
            body: formData,
            credentials: 'include'
        });
        const data = await res.json();
        if (data.success) {
            alert('Upload successful!');
            loadVideos();
        } else {
            alert('Upload failed: ' + data.message);
        }
    };

    document.getElementById('uploadPdfForm').onsubmit = async function(e) { // New event listener for PDF upload form
        e.preventDefault();
        const fileInput = document.getElementById('pdfFile');
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        const res = await fetch('/api/upload_pdf', { // Use the new PDF upload endpoint
            method: 'POST',
            body: formData,
            credentials: 'include'
        });
        const data = await res.json();
        if (data.success) {
            alert('PDF Upload successful!');
            loadPdfs(); // Refresh the PDF list
            fileInput.value = null; // Clear the file input
        } else {
            alert('PDF Upload failed: ' + data.message);
        }
    };

    loadVideos();
    loadPdfs(); // Load PDFs on page load
    </script>
</body>
</html>
