
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Progress Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Watch The Video</h1>

    <div class="video-container">
        <video id="myVideo" controls>
            <source src="TP.mp4" type="video/mp4">
            Your browser doesn't support the video tag.
        </video>
    </div>

    <div class="progress-info">
        <div>You've watched <span id="progressText">0.0</span>% of this video</div>
        <progress id="progressBar" value="0" max="100"></progress>
        
        <div class="control-buttons">
            <button class="btn reset" id="resetProgress">Reset Progress</button>
            <button class="btn" id="jumpToMax">Continue Watching</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
