<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Progress Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pdf_style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

    <h1>View The Document</h1>

    <!-- Add file selector -->
    <div class="file-selector">
        <label for="pdfFile" class="file-label">Choose PDF File</label>
        <input type="file" id="pdfFile" accept="application/pdf" />
    </div>

    <div class="pdf-container">
        <div id="pdfViewer"></div>
        <div class="pdf-controls">
            <button id="prevPage" class="btn">Previous</button>
            <span id="pageInfo">Page <span id="currentPage">0</span> of <span id="totalPages">0</span></span>
            <button id="nextPage" class="btn">Next</button>
        </div>
    </div>

    <div class="progress-info">
        <div>You've read <span id="progressText">0.0</span>% of this document</div>
        <progress id="progressBar" value="0" max="100"></progress>
        
        <div class="control-buttons">
            <button class="btn reset" id="resetProgress">Reset Progress</button>
            <button class="btn" id="jumpToMax">Continue Reading</button>
        </div>
    </div>

    <script src="pdf_script.js"></script>
</body>
</html>
