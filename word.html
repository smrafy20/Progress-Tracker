<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docx Learning Progress Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="height: 100vh; display: flex; flex-direction: column;">
    <h1>Learning Progress Tracker</h1>
    <input type="file" id="upload" accept=".docx" />
    <div id="content-container" style="flex: 1 1 auto; overflow-y: auto; border: 1px solid #ccc; padding: 1em; background: #fff; min-height: 0;"></div>
    <div id="progress-bar-container">
      <label for="progress-bar">Progress:</label>
      <progress id="progress-bar" value="0" max="100"></progress>
      <span id="progress-percentage">0%</span>
    </div>
  </div>

  <script src="mammoth.browser.min.js"></script>
  <script src="word.js"></script>
</body>
</html>
