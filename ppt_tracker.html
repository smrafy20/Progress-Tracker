<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT Progress Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Reveal.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/theme/white.css">
    
    <link rel="stylesheet" href="ppt_style.css">
</head>
<body>
    <nav>
        <ul>
            <li><span class="site-title">Training PRO</span></li>
            <li><a href="student.html">Dashboard</a></li>
            <li class="nav-right">
                <span class="student-name">Welcome, <span id="studentName">Student</span></span>
                <button onclick="logout()" class="logout-btn">Logout</button>
            </li>
        </ul>
    </nav>
    <h1>View The Presentation</h1>
    
    <!-- Reveal.js presentation container -->
    <div class="reveal" id="pptViewer">
        <div class="slides" id="pptSlides">
            <!-- Slides will be dynamically loaded here -->
            <section>
                <div style="text-align:center; padding:40px 20px;">
                    <h3>Loading presentation...</h3>
                </div>
            </section>
        </div>
    </div>
    
    <!-- Custom controls and progress panel -->
    <div class="ppt-controls-panel">
        <div class="ppt-controls">
            <button id="prevSlide" class="btn">Previous</button>
            <span id="slideInfo">Slide <span id="currentSlide">0</span> of <span id="totalSlides">0</span></span>
            <button id="nextSlide" class="btn">Next</button>
            
            <div class="zoom-controls">
                <button id="zoomOut" class="btn zoom-btn">-</button>
                <span id="zoomLevel">100%</span>
                <button id="zoomIn" class="btn zoom-btn">+</button>
                <button id="resetZoom" class="btn fit-btn">Reset</button>
            </div>
        </div>    <div class="progress-info">
        <div>You've viewed <span id="progressText">0.0</span>% of this presentation</div>
        <progress id="progressBar" value="0" max="100"></progress>
        
        <div class="control-buttons">
            <button class="btn reset" id="resetProgress">Reset Progress</button>
            <button class="btn" id="jumpToMax">Continue Viewing</button>
        </div>
    </div>

    <!-- Include Reveal.js JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reveal.js"></script>
    
    <script>
    // Logout function
    async function logout() {
        const res = await fetch('/api/logout', {
            method: 'POST',
            credentials: 'include'
        });
        const data = await res.json();
        if (data.success) {
            window.location.href = 'login.html';
        } else {
            alert('Logout failed. Please try again.');
        }
    }

    // Load student name
    async function loadStudentName() {
        try {
            const res = await fetch('/api/get_session_info', {credentials: 'include'});
            if (res.ok) {
                const data = await res.json();
                if (data.success && data.name) {
                    document.getElementById('studentName').textContent = data.name;
                }
            }
        } catch (error) {
            console.error("Error loading student name:", error);
        }
    }
    
    // Load student name when page loads
    loadStudentName();
    </script>
    <script src="ppt_script.js"></script>
</body>
</html>
